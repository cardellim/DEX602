<template>
	<template lwc:if={studentId}>
		<!-- TODO #7: Use the cardTitle getter to display a dynamic title for the lightning-card -->
		<lightning-card title={cardTitle}>
			<lightning-button label="Go to Record" slot="actions" onclick={navigateToRecord}></lightning-button>
			<template lwc:if={wiredStudent.data}>
				<div class="slds-var-p-horizontal_medium">
					<p>Email: <lightning-formatted-email value={email}></lightning-formatted-email></p>
					<p>Phone: <lightning-formatted-phone value={phone}></lightning-formatted-phone></p>
					<p>Description: {description}</p>
				</div>
			</template>
			<template lwc:if={wiredStudent.error}>
				<div class="slds-var-p-horizontal_medium">
					<c-error-panel type="inlineMessage" errors={wiredStudent.error}></c-error-panel>
				</div>
			</template>
		</lightning-card>
	</template>
</template>
